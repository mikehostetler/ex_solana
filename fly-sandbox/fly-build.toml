# Fly.io configuration for building the sandbox base image
# This file is ONLY used for `fly deploy --build-only --push`
# Actual sandbox deployment is done via mix tasks using req_fly API
#
# Usage:
#   fly deploy -c fly-build.toml --build-only --push --image-label latest

app = "jido-sandbox-base"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  CODE_SERVER_PORT = "9090"

[http_service]
  internal_port = 9090
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
